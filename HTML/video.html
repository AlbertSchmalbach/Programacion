<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video HTML</title>
  </head>

  <body>
    <video
      src="video/quebrada.mp4"
      controls
      width="560px"
      height="315px"
      poster="img/banner-desktop-800x400.jpg"
      preload="auto"
    ></video>

    <div>
      <audio src="audio/audio.mp3" controls preload="auto"></audio>
    </div>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/UbzN-hZrqjw?si=3Zmi6Zd1fYgadsXT&start=50"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
