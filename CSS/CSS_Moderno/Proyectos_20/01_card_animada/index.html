<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Animada</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article class="card">
      <figure class="card__figure">
        <img src="img/spiderman.webp" alt="Spiderman" class="card__img" />
      </figure>

      <div class="card__name">
        <h2 class="card__title">Spiderman</h2>
      </div>

      <p class="card__text">
        Spider-Man, en español a veces El Hombre Araña, es un superhéroe de los
        cómics estadounidenses publicados por Marvel Comics. Creado por Stan Lee
        y Steve Ditko.
      </p>
    </article>
  </body>
</html>
